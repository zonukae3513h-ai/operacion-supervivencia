
name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto Android
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró el archivo ZIP del proyecto."
            exit 1
          fi
          mkdir -p /tmp/proyecto
          unzip -oq "$ZIP_FILE" -d /tmp/proyecto
          PROJECT_DIR=$(find /tmp/proyecto -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No se encontró el proyecto Android dentro del ZIP."
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -oq /tmp/gradle.zip -d /tmp

      - name: Compilar APK
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: OperacionSupervivencia-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
